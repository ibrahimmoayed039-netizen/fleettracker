<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Agrimatco - Fleet</title>
<style>
body{font-family:Segoe UI,Tahoma,sans-serif;margin:0;background:#f4f6f8;color:#222}
header{background:#0a8f4b;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
nav{display:flex;background:#fff;border-bottom:1px solid #ddd}

main{padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px #0002;margin-bottom:14px}

.big{font-size:26px;font-weight:bold;color:#0a8f4b}

input{padding:8px;font-size:15px;margin-bottom:10px;width:100%;box-sizing:border-box}
td input{margin:0}
select{padding:8px;font-size:15px;margin-bottom:12px}
.form{max-width:560px}
button.p{padding:8px 16px;font-size:14px;background:#0a8f4b;color:#fff;border:0;border-radius:6px;cursor:pointer;margin-left:6px}
button.r{background:#c62828}
.msg{margin:8px 0;color:#c62828}.ok{color:#2e7d32}
.off{opacity:.5}
img{max-width:100%;border-radius:6px;cursor:pointer;min-height:60px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 4px #0002}
.kpi small{color:#666}.kpi .v{font-size:22px;font-weight:bold;color:#0a8f4b}
.up{color:#c62828}.dn{color:#2e7d32}.eq{color:#666}
.hb{display:flex;align-items:center;gap:8px;margin:6px 0}
.hb .l{width:110px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .t{flex:1;background:#eef2f7;border-radius:6px;height:22px;overflow:hidden}
.hb .f{height:100%;background:#0a8f4b;border-radius:6px;min-width:2px}
.hb .n{width:90px;font-size:13px;color:#444}
.cols{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:20px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.col .b{width:70%;max-width:46px;background:#0a8f4b;border-radius:6px 6px 0 0;min-height:2px}

.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar select{margin:0}
@media print{header,nav,.noprint{display:none!important}body{background:#fff}main{padding:0}.card{box-shadow:none;border:1px solid #ccc}}
.bar input{margin:0;width:auto}

.pg{background:#eef2f7;border-radius:6px;height:12px;overflow:hidden;margin:6px 0}
.pg div{height:100%;border-radius:6px}
.st-ok{color:#2e7d32}.st-soon{color:#ef6c00}.st-late{color:#c62828}
.mi{border-top:1px solid #eee;padding:10px 0}

/* ===== Agrimatco - Fleet : تصميم احترافي مجسّم ===== */
:root{--g1:#17b865;--g2:#0a8f4b;--g3:#05643a;--ink:#10241a}
body{font-family:'Segoe UI',Tahoma,sans-serif;color:var(--ink);min-height:100vh;
  background:radial-gradient(1100px 480px at 85% -8%,#d3f0df 0,transparent 62%),linear-gradient(180deg,#eef3f0,#e2eae5);background-attachment:fixed}
header.top{background:linear-gradient(135deg,#0a3a22 0%,#05643a 48%,#0a8f4b 100%);padding:10px 24px;position:relative;z-index:5;
  box-shadow:0 8px 20px #05301c66,inset 0 1px 0 #ffffff40,inset 0 -3px 0 #00000026}
.brand{display:flex;align-items:center;gap:16px}
.brand h1{margin:0;font-size:24px;letter-spacing:.6px;direction:ltr;text-align:left;text-shadow:0 2px 3px #0007}
.brand small{display:block;opacity:.88;font-size:12px;margin-top:2px}
.logo3d{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,#e9efeb);padding:4px;
  box-shadow:0 8px 16px #0008,0 0 0 3px #ffffff59,inset 0 -5px 9px #0003;transform:perspective(320px) rotateY(-14deg);transition:transform .45s}
.logo3d:hover{transform:perspective(320px) rotateY(14deg) scale(1.07)}
.logo3d img{width:100%;height:100%;min-height:0;border-radius:50%;cursor:default;display:block}
header.top #st{background:#00000030;border-radius:20px;padding:4px 14px;box-shadow:inset 0 2px 4px #0005}
nav{gap:7px;padding:10px 12px 8px;border:0;background:linear-gradient(#ffffff,#eef3f0);box-shadow:0 6px 14px -4px #0a3d2455;position:relative;z-index:4}
nav button{border:0;border-radius:11px;color:#2c3e34;font-weight:600;background:linear-gradient(#fff,#e9efeb);
  box-shadow:0 3px 0 #c5d3ca,0 6px 9px #0a3d2422,inset 0 1px 0 #fff;transition:transform .12s,box-shadow .12s;margin-bottom:3px}
nav button:hover{transform:translateY(-2px);box-shadow:0 5px 0 #c5d3ca,0 10px 14px #0a3d2430,inset 0 1px 0 #fff}
nav button:active{transform:translateY(2px);box-shadow:0 1px 0 #c5d3ca}
nav button.on{border:0;color:#fff;background:linear-gradient(#1ac56d,#0a8f4b 55%,#07743c);
  box-shadow:0 3px 0 #05643a,0 8px 14px #0a8f4b66,inset 0 1px 0 #ffffff66;text-shadow:0 1px 2px #0005}
main{padding:22px}
.card{border-radius:15px;border:1px solid #ffffffb0;background:linear-gradient(180deg,#fff,#f6faf8);
  box-shadow:0 1px 0 #fff inset,0 2px 4px #0a3d2414,0 14px 26px -12px #0a3d2466;transition:transform .2s,box-shadow .2s}
.grid .card:hover,.card.click:hover{transform:translateY(-4px);box-shadow:0 1px 0 #fff inset,0 3px 6px #0a3d2420,0 22px 32px -12px #0a3d2477}
.card h2,.card h3{color:var(--g3)}
.big{color:var(--g2);text-shadow:0 1px 0 #fff}
.kpi{border-radius:15px;background:linear-gradient(150deg,#fff,#e8f5ee);border-bottom:4px solid var(--g2);
  box-shadow:0 1px 0 #fff inset,0 2px 0 #cfe3d7,0 12px 20px -8px #0a3d2466}
.kpi .v{color:var(--g3);text-shadow:0 1px 0 #fff}
button.p{background:linear-gradient(#1ac56d,#0a8f4b 60%,#07743c);border-radius:10px;font-weight:600;padding:9px 18px;margin-bottom:5px;
  text-shadow:0 1px 2px #0004;position:relative;top:0;box-shadow:0 4px 0 #05643a,0 9px 14px #0a3d2440,inset 0 1px 0 #ffffff66;transition:top .08s,box-shadow .08s,filter .15s}
button.p:hover{filter:brightness(1.08)}
button.p:active{top:3px;box-shadow:0 1px 0 #05643a,0 3px 5px #0a3d2440}
button.p.r{background:linear-gradient(#ee4a47,#c62828 60%,#a91d1d);box-shadow:0 4px 0 #861616,0 9px 14px #5a0e0e40,inset 0 1px 0 #ffffff55}
button.p.r:active{box-shadow:0 1px 0 #861616}
input,select,textarea{border:1px solid #c3d3c9;border-radius:10px;background:#fbfdfc;box-shadow:inset 0 2px 5px #0a3d2420;outline:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--g2);box-shadow:inset 0 2px 5px #0a3d2420,0 0 0 3px #0a8f4b33}
table{border-radius:12px;overflow:hidden;box-shadow:0 2px 0 #fff inset,0 8px 18px -8px #0a3d2455}
th{background:linear-gradient(#ecf7f1,#d6ebdf);color:var(--g3);border-bottom:2px solid #0a8f4b55}
tbody tr:hover td,tr:hover>td{background:#f2faf6}
.hb .t{box-shadow:inset 0 2px 4px #0a3d2428;background:#e3ece7}
.hb .f{background:linear-gradient(180deg,#34d684,#0a8f4b 55%,#05643a);box-shadow:inset 0 2px 0 #ffffff59,0 2px 4px #0a3d2440}
.col .b{background:linear-gradient(90deg,#05643a,#1ec772 42%,#0a8f4b 62%,#05643a);box-shadow:4px 0 8px #0a3d2440,inset 0 3px 0 #ffffff66}
.col .b.cur{background:linear-gradient(90deg,#b37000,#ffcd4d 42%,#f9a825 62%,#b37000)}
.chip{box-shadow:0 2px 0 #bfe4cd;font-weight:600}
.av{box-shadow:0 3px 6px #0004,0 0 0 2px #fff}
details.day{box-shadow:0 2px 0 #fff inset,0 8px 16px -8px #0a3d2455}
.nw{box-shadow:0 8px 16px -8px #0a3d2455}
.al{box-shadow:0 8px 16px -8px #c6282866}
.phead,.pfoot,.pmark{display:none}
@media print{
  @page{size:A4;margin:12mm 10mm 12mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;min-height:0}
  header.top,nav{display:none!important}
  .pwrap{display:table;width:100%}
  .pth{display:table-header-group}.ptb{display:table-row-group}.ptf{display:table-footer-group}
  .phead{display:flex;height:20mm;align-items:center;gap:12px;border-bottom:3px solid #0a8f4b;padding-bottom:3px;margin-bottom:5mm;background:#fff}
  .phead img{width:18mm;height:18mm;min-height:0;border-radius:0}
  .phead b{font-size:21px;direction:ltr;color:#05643a;letter-spacing:.5px}
  .phead small{margin-right:auto;color:#555;font-size:12px}
  .pfoot{display:block;text-align:center;font-size:11px;color:#666;border-top:1px solid #bbb;padding-top:3px;margin-top:5mm}
  .pmark{display:block;position:fixed;top:50%;left:50%;width:120mm;height:120mm;margin:-60mm 0 0 -60mm;opacity:.06;z-index:-1}
  .pmark img{width:100%;min-height:0;border-radius:0}
  .card,.kpi{background:#fff;box-shadow:none;border:1px solid #ccc;transform:none}
  table{box-shadow:none;overflow:visible}
  tr{break-inside:avoid}
  thead{display:table-header-group}
}
body.pdfmode .pth,body.pdfmode .ptf{display:none!important}
</style></head><body>
<div class="pmark"><img src="assets/logo.png" alt=""></div>
<header class="top">
  <div class="brand">
    <div class="logo3d"><img src="assets/logo.png" alt="Agrimatco"></div>
    <div><h1>Agrimatco - Fleet</h1><small>نظام متابعة المركبات والسائقين</small></div>
  </div>
  <small id="st"></small>
</header>
<nav>
  <button data-t="now" class="on">اليوم الآن</button>
  <button data-t="cars">السائقون</button>
  <button data-t="stats">الإحصائيات</button>
  <button data-t="trips">الرحلات اليومية</button>
  <button data-t="mnt">الصيانة</button>
  <button data-t="del">الحذف والتصحيح</button>
  <button data-t="rep">التقارير</button>
  <button data-t="det">التفاصيل</button>
  <button data-t="inv">الفواتير</button>
  <button data-t="drv">إدارة السائقين</button>
  <button data-t="set">الإعدادات</button>
</nav>
<div class="pwrap">
<div class="pth"><div class="phead"><img src="assets/logo.png" alt=""><b>Agrimatco - Fleet</b><small>نظام متابعة المركبات — <span id="pdate"></span></small></div></div>
<div class="ptb"><main id="m"></main></div>
<div class="ptf"><div class="pfoot">Agrimatco - Fleet</div></div>
</div>
<div id="ov" onclick="this.style.display='none'"><img id="ovi"></div>
<script>
const ADMIN = 'admin@fleet.local';
let cfg = {}; try { cfg = JSON.parse(localStorage.getItem('cfg') || '{}'); } catch {}
let D = [], sel = '', last = '', tok = null, tokExp = 0, flash = '';
let tab = (cfg.api && cfg.db && localStorage.getItem('adm')) ? 'now' : 'set';
const imgs = new Map();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Number.isInteger(n) ? n : n.toFixed(1);
const when = t => t ? new Date(t).toLocaleString('ar') : '-';
const dbUrl = () => cfg.db.replace(/\/+$/, '');
const setStatus = t => $('#st').textContent = t;
const tr = m => ({
  EMAIL_EXISTS: 'اسم المستخدم مستخدم مسبقاً',
  INVALID_LOGIN_CREDENTIALS: 'كلمة المرور غير صحيحة',
  INVALID_PASSWORD: 'كلمة المرور غير صحيحة',
  EMAIL_NOT_FOUND: 'حساب المدير غير موجود، اضغط «إنشاء حساب المدير»',
  OPERATION_NOT_ALLOWED: 'فعّل Email/Password في Firebase Authentication',
  WEAK_PASSWORD: 'كلمة المرور ضعيفة (6 أحرف على الأقل)'
}[String(m).split(' ')[0]] || m);

// ---------- Firebase Auth (REST) ----------
async function authCall(endpoint, body) {
  const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:${endpoint}?key=${encodeURIComponent(cfg.api)}`,
    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...body, returnSecureToken: true }) });
  const j = await r.json();
  if (j.error) throw new Error(tr(j.error.message));
  return j;
}
function saveSession(j) {
  localStorage.setItem('adm', j.refreshToken);
  tok = j.idToken; tokExp = Date.now() + 50 * 60000;
}
async function token() {
  if (tok && Date.now() < tokExp) return tok;
  const rt = localStorage.getItem('adm');
  if (!rt) throw new Error('سجّل دخول المدير من الإعدادات');
  const r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + encodeURIComponent(cfg.api), {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(rt) });
  const j = await r.json();
  if (!j.id_token) { localStorage.removeItem('adm'); throw new Error('انتهت الجلسة، سجّل الدخول مجدداً'); }
  tok = j.id_token; tokExp = Date.now() + 50 * 60000; return tok;
}
async function api(method, path, body) {
  const r = await fetch(`${dbUrl()}/${path}.json?auth=${await token()}`,
    { method, headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// ---------- إحصاءات ----------
function stats(v) {
  const p = [...v.points].sort((a, b) => a.time - b.time); let t = 0;
  const rows = p.map((x, i) => { const s = i ? Math.max(0, x.odo - p[i - 1].odo) : 0; t += s; return { ...x, seg: s }; });
  return { rows, total: t };
}
const dur = ms => { const m = Math.max(0, Math.round(ms / 60000)), h = Math.floor(m / 60); return h ? `${h} س ${m % 60} د` : `${m} د`; };
const kindIc = r => r.kind === 'start' ? '🟢 انطلاق' : r.kind === 'end' ? '🏁 نهاية' : r.kind === 'stop' ? '📍 توقف' : '';
const PF = [['name', 'الاسم'], ['phone', 'رقم الهاتف'], ['carType', 'نوع السيارة'], ['model', 'الموديل'], ['color', 'اللون'], ['plate', 'رقم المركبة'], ['vin', 'رقم الشاصي']];
const profBlock = v => { const p = v.profile || {};
  return Object.keys(p).length ? `<div class="card"><h3>${av(v.uid)} بيانات السائق والمركبة</h3><table>${PF.map(([k, l]) => `<tr><th style="width:160px">${l}</th><td>${esc(p[k])}</td></tr>`).join('')}</table></div>`
    : '<div class="card"><small>لم يُدخل السائق بيانات المركبة بعد.</small></div>'; };
const edLog = r => Object.values(r.editLog || {});
const edTag = r => { const l = edLog(r); return l.length ? ` <span title="${esc(l.map(e => `${fmt(+e.from)} ← ${fmt(+e.to)} (${when(e.time)}): ${e.reason}`).join('\n'))}" style="color:#ef6c00;cursor:help">✏ مصحّح${l.length > 1 ? ' ×' + l.length : ''} (الأصلي ${fmt(+l[0].from)})</span>` : ''; };
const stopDur = r => r.kind === 'stop' ? (r.leave ? dur(r.leave - r.time) : 'لم يغادر بعد') : '';
function tripsTbl(v) {
  if (!(v.trips || []).length) return '';
  return `<h3>الرحلات (${v.trips.length})</h3><table><tr><th>البداية</th><th>النهاية</th><th>مدة الرحلة</th><th>المسافة</th><th>التوقفات</th><th>مجموع وقت التوقف</th><th class="noprint">حذف</th></tr>
    ${[...v.trips].sort((a, b) => b.startTime - a.startTime).map(t => {
      const ps = v.points.filter(p => p.tripId === t.id), stops = ps.filter(p => p.kind === 'stop'), end = t.endTime || 0;
      const odo = end ? t.endOdo : Math.max(t.startOdo, ...ps.map(p => p.odo));
      const stopMs = stops.reduce((a, p) => a + ((p.leave || end || Date.now()) - p.time), 0);
      return `<tr><td>${when(t.startTime)}</td><td>${end ? when(end) : '<b>جارية</b>'}</td><td>${dur((end || Date.now()) - t.startTime)}</td><td>${fmt(odo - t.startOdo)} كم</td><td>${stops.length}</td><td>${dur(stopMs)}</td><td class="noprint"><button class="p r tdel" data-u="${esc(v.uid)}" data-t="${t.id}">🗑 حذف</button></td></tr>`;
    }).join('')}</table>`;
}
async function loadImg(el) {
  const k = el.dataset.v + '/' + el.dataset.id;
  try {
    if (!imgs.has(k)) {
      const s = await api('GET', `images/${encodeURIComponent(el.dataset.v)}/${el.dataset.id}`);
      if (s) imgs.set(k, 'data:image/jpeg;base64,' + s);
    }
    if (imgs.has(k)) el.src = imgs.get(k);
  } catch {}
}


// ---------- لوحة الإحصائيات ----------
let stDrv = '', stMon = '', stRange = 6;
const mk = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const mlabel = k => { const [y, m] = k.split('-'); return new Date(+y, +m - 1, 1).toLocaleDateString('ar', { month: 'short', year: '2-digit' }); };
const mfull = k => { const [y, m] = k.split('-'); return new Date(+y, +m - 1, 1).toLocaleDateString('ar', { month: 'long', year: 'numeric' }); };
const monthsBack = n => { const a = [], d = new Date(); for (let i = n - 1; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); a.push(x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0')); } return a; };
const num = s => {
  const t = String(s ?? '').replace(/[٠-٩]/g, c => c.charCodeAt(0) - 1632).replace(/[۰-۹]/g, c => c.charCodeAt(0) - 1776)
    .replace(/٫/g, '.').replace(/[,٬،\s]/g, '').replace(/[^0-9.\-]/g, '');
  const n = parseFloat(t); return isFinite(n) ? n : 0;
};
const money = n => Math.round(n).toLocaleString('en-US');
function hbars(items, unit) {
  const mx = Math.max(...items.map(i => i.val), 0) || 1;
  return items.map(i => `<div class="hb"><div class="l" title="${esc(i.label)}">${esc(i.label)}</div>
    <div class="t"><div class="f" style="width:${(i.val / mx * 100).toFixed(1)}%"></div></div>
    <div class="n">${unit === 'كم' ? fmt(i.val) : money(i.val)} ${unit}</div></div>`).join('');
}
function cols(keys, data, unit, curKey) {
  const mx = Math.max(...keys.map(k => data[k] || 0), 0) || 1;
  return '<div class="cols">' + keys.map(k => {
    const v = data[k] || 0;
    return `<div class="col"><div class="n">${v ? (unit === 'كم' ? fmt(v) : money(v)) : ''}</div>
      <div class="b ${k === curKey ? 'cur' : ''}" style="height:${(v / mx * 100).toFixed(1)}%"></div><div class="m">${mlabel(k)}</div></div>`;
  }).join('') + '</div>';
}
function delta(cur, prev, goodDown) {

let rpDrv = '', rpMon = '';
function reportData() {
  const list = D.filter(v => v.points.length || v.invoices.length);

}

let MI = [], mErr = false;
const vkey = v => encodeURIComponent(v).replace(/\./g, '%2E');
const PRESETS = [['تغيير زيت المحرك', 5000], ['تغيير الإطارات', 40000], ['فحص دوري', 10000], ['فلتر الهواء', 15000], ['فحص الفرامل', 20000], ['أخرى', 10000]];
function mntVehicles() {
  const map = {};
  D.forEach(v => {
    if (!v.vehicle) return;
    const e = map[v.vehicle] || (map[v.vehicle] = { veh: v.vehicle, odo: 0, time: 0, drivers: [], items: [] });
    if (!e.drivers.includes(v.name)) e.drivers.push(v.name);
    v.points.forEach(p => { if (p.time >= e.time) { e.time = p.time; e.odo = p.odo; } });
  });
  MI.forEach(i => { (map[i.veh] || (map[i.veh] = { veh: i.veh, odo: 0, time: 0, drivers: [], items: [] })).items.push(i); });
  return Object.values(map);
}
function mntState(it, odo) {
  const rem = it.last + it.interval - odo, th = Math.min(1000, Math.max(200, it.interval * 0.1));
  return { rem, st: rem < 0 ? 'late' : rem <= th ? 'soon' : 'ok' };
}
function mntAlerts() {
  const out = [];

  return out.sort((a, b) => a.rem - b.rem);
}

// ---------- الرحلات اليومية (لكل سائق حسب الأيام) ----------
const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dayLabel = k => new Date(k + 'T12:00:00').toLocaleDateString('ar', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const hm = t => new Date(t).toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' });
function drawTrips(m) {
  if (!D.length) { m.innerHTML = '<p>لا توجد بيانات بعد.</p>'; return; }
  m.innerHTML = `<div class="card"><div class="bar">
      <select id="t1"><option value="">كل السائقين</option>${D.map(v => `<option value="${esc(v.uid)}" ${v.uid === F.drv ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select>
      <label>من <input type="date" id="t2" value="${esc(F.from)}"></label><label>إلى <input type="date" id="t3" value="${esc(F.to)}"></label>
      <button class="p" id="tt">اليوم</button><button class="p" id="tm">هذا الشهر</button><button class="p r" id="tc">مسح</button></div></div><div id="res"></div>`;
  const run = () => {
    const [t0, t1] = fRange(); let h = '';
    D.filter(v => !F.drv || v.uid === F.drv).forEach(v => {
      const days = {};
      stats(v).rows.filter(r => r.time >= t0 && r.time <= t1).forEach(r => (days[dayKey(r.time)] ||= { pts: [], inv: [] }).pts.push(r));
      v.invoices.filter(i => i.time >= t0 && i.time <= t1).forEach(i => (days[dayKey(i.time)] ||= { pts: [], inv: [] }).inv.push(i));
      const keys = Object.keys(days).sort().reverse(); if (!keys.length) return;
      const totD = keys.reduce((t, k) => t + days[k].pts.reduce((a, r) => a + r.seg, 0), 0);
      const totE = keys.reduce((t, k) => t + days[k].inv.reduce((a, i) => a + num(i.amount), 0), 0);
      h += `<div class="card ${v.active ? '' : 'off'}"><h3>${av(v.uid)} ${esc(v.name)} <small>— ${esc(v.vehicle || 'بدون مركبة')}</small></h3>
        <div>أيام العمل: <b>${keys.length}</b> — المسافة: <b>${fmt(totD)} كم</b> — المصروفات: <b>${money(totE)}</b></div>
        ${keys.map((k, idx) => {
          const d = days[k], dist = d.pts.reduce((a, r) => a + r.seg, 0), ex = d.inv.reduce((a, i) => a + num(i.amount), 0);
          return `<details class="day" ${idx === 0 ? 'open' : ''}><summary><span>📅 ${dayLabel(k)}</span><small>🚗 ${fmt(dist)} كم</small><small>📍 ${d.pts.length} نقطة</small><small>🧾 ${d.inv.length} فاتورة${d.inv.length ? ' (' + money(ex) + ')' : ''}</small></summary>
            <div class="bd">${d.pts.length ? `<table><tr><th>الوقت</th><th>النقطة</th><th>العداد</th><th>المسافة من السابقة</th><th>النوع</th><th>مدة التوقف</th></tr>
              ${d.pts.map(r => `<tr><td>${hm(r.time)}</td><td>${esc(r.name)}</td><td>${fmt(r.odo)}${edTag(r)}</td><td>${fmt(r.seg)} كم</td><td>${kindIc(r)}</td><td>${stopDur(r)}</td></tr>`).join('')}</table>` : '<small>لا توجد نقاط توقف</small>'}
              ${d.inv.length ? `<table style="margin-top:8px"><tr><th>الوقت</th><th>الفاتورة</th><th>المبلغ</th></tr>
              ${d.inv.sort((a, b) => a.time - b.time).map(i => `<tr><td>${hm(i.time)}</td><td>${esc(i.note)}</td><td>${esc(i.amount)}</td></tr>`).join('')}</table>` : ''}</div></details>`;
        }).join('')}</div>`;
    });
    $('#res').innerHTML = h || '<p>لا توجد رحلات ضمن هذا الفلتر.</p>';
  };
  $('#t1').onchange = e => { F.drv = e.target.value; run(); };

  $('#tm').onclick = () => {
    const d = new Date(), p2 = n => String(n).padStart(2, '0'), last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    F.from = `${d.getFullYear()}-${p2(d.getMonth() + 1)}-01`; F.to = `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(last)}`; draw();
  };
  $('#tc').onclick = () => { F.drv = F.from = F.to = ''; draw(); };
  run();
}

// ---------- لوحة «اليوم الآن» ----------
function nowInfo(v) {
  const now = Date.now(), t0 = new Date().setHours(0, 0, 0, 0);
  const trips = [...(v.trips || [])].sort((a, b) => a.startTime - b.startTime);
  const act = trips.filter(t => !t.endTime).pop() || null;
  const todays = trips.filter(t => t.startTime >= t0 || t.endTime >= t0 || !t.endTime);
  const ids = new Set(todays.map(t => t.id));
  const tp = v.points.filter(p => ids.has(p.tripId)).sort((a, b) => a.time - b.time);
  let km = 0, stopMs = 0, stops = 0;
  todays.forEach(t => {
    const ps = v.points.filter(p => p.tripId === t.id);
    km += (t.endTime ? t.endOdo : Math.max(t.startOdo, ...ps.map(p => p.odo))) - t.startOdo;
    ps.filter(p => p.kind === 'stop').forEach(p => { stops++; stopMs += (p.leave || t.endTime || now) - p.time; });
  });
  const exp = v.invoices.filter(i => i.time >= t0).reduce((a, i) => a + num(i.amount), 0);
  const open = act ? tp.filter(p => p.tripId === act.id && p.kind === 'stop' && !p.leave).pop() : null;
  const lastP = act ? tp.filter(p => p.tripId === act.id).pop() : null;
  let cls = 'nw', st, detail = '', rank, warns = [];
  if (act) {
    if (open) { cls += ' n-sp'; st = '⏸ متوقف'; detail = `في «${esc(open.name)}» منذ ${dur(now - open.time)}`; rank = 1;
      if (now - open.time > 60 * 60000) { cls = 'nw n-wr'; rank = 0; warns.push(`${v.name} متوقف في «${open.name}» منذ ${dur(now - open.time)}`); } }
    else { cls += ' n-mv'; st = '🚗 في الطريق'; rank = 2;
      const from = lastP ? Math.max(lastP.time, lastP.leave || 0) : act.startTime;
      detail = lastP ? `منذ ${dur(now - from)} من «${esc(lastP.name)}»` : ''; }
    if (now - act.startTime > 12 * 3600000) { cls = 'nw n-wr'; rank = 0; warns.push(`${v.name}: رحلة مفتوحة منذ ${dur(now - act.startTime)} (ربما نسي الإنهاء)`); }
    if (v.lastSync && now - v.lastSync > 3 * 3600000) warns.push(`${v.name}: آخر مزامنة منذ ${dur(now - v.lastSync)} (قد يكون بدون إنترنت)`);
  } else if (todays.length) { cls += ' n-dn'; st = '✅ أنهى رحلته'; rank = 4;
    detail = `انتهت ${hm(Math.max(...todays.map(t => t.endTime)))}`; }
  else { st = '⚪ لم يبدأ اليوم'; rank = 3; }
  return { v, act, todays, tp, km, stopMs, stops, exp, cls, st, detail, rank, warns };
}
function drawNow(m) {

    ${warns.length ? `<div class="al"><b>⚠ تنبيهات (${warns.length})</b><br>${warns.map(w => '• ' + esc(w)).join('<br>')}</div>` : ''}
    <div class="kpis">
      <div class="kpi"><small>في رحلة الآن</small><div class="v">${inTrip}</div><small>منهم متوقفون: ${stopped}</small></div>

      <div class="kpi"><small>مصروفات اليوم</small><div class="v">${money(list.reduce((a, x) => a + x.exp, 0))}</div></div>
    </div>
    <div class="grid">${list.map(x => {

        ${x.act ? `<div>بدأت الرحلة ${hm(x.act.startTime)} — مضى ${dur(Date.now() - x.act.startTime)}</div>` : ''}
        ${rows.length ? `<div class="tl">${x.tp.length > rows.length ? '… ' : ''}${rows.map(p => `${hm(p.time)} ${kindIc(p)} ${esc(p.name)}${p.kind === 'stop' ? ` <small>(${p.leave ? dur(p.leave - p.time) : 'متوقف'})</small>` : ''}`).join('<br>')}</div>` : ''}
        <small>آخر مزامنة: ${x.v.lastSync ? dur(Date.now() - x.v.lastSync) + ' مضت' : '-'}</small></div>`;
    }).join('')}</div>`;
  m.querySelectorAll('.card.click').forEach(c => c.onclick = () => { F.drv = c.dataset.u; sel = c.dataset.u; tab = 'det'; draw(); });
}

      say('جارٍ الإضافة...', true);
      const j = await authCall('signUp', { email: user + '@fleet.local', password: pw });
      await api('PUT', 'drivers/' + j.localId, { name, username: user, vehicle: veh, active: true, created: Date.now() });
      flash = 'تمت إضافة السائق ✓ — أعطه كود الإعداد واسم المستخدم وكلمة المرور';
      await poll(true); draw();
    } catch (e) { say(e.message); }
  };
  m.querySelectorAll('.sv').forEach(b => b.onclick = async () => {
    const u = b.dataset.u, g = f => m.querySelector(`input[data-f=${f}][data-u="${u}"]`).value.trim();
    try { await api('PUT', `drivers/${u}/name`, g('n')); await api('PUT', `drivers/${u}/vehicle`, g('v')); await poll(true); flash = 'تم الحفظ ✓'; draw(); }
    catch (e) { say(e.message); }
  });
  m.querySelectorAll('.tg').forEach(b => b.onclick = async () => {
    const v = D.find(x => x.uid === b.dataset.u);
    try { await api('PUT', `drivers/${v.uid}/active`, !v.active); await poll(true); draw(); }
    catch (e) { say(e.message); }
  });
}

function drawSettings(m) {
  const logged = !!localStorage.getItem('adm');
  const code = (cfg.api && cfg.db) ? 'FLEET:' + btoa(JSON.stringify({ a: cfg.api, d: cfg.db.replace(/\/+$/, '') })) : '';
  m.innerHTML = `<div class="form">
    <div class="card"><h3>1) إعدادات Firebase</h3>
      <label>Web API Key</label><input id="c1" value="${esc(cfg.api)}" dir="ltr">
      <label>رابط قاعدة البيانات</label><input id="c2" value="${esc(cfg.db)}" dir="ltr">
      <button class="p" id="sv">حفظ</button></div>
    <div class="card"><h3>2) حساب المدير ${logged ? '✓ مسجّل الدخول' : ''}</h3>
      <label>كلمة مرور المدير</label><input id="c3" type="password">
      <button class="p" id="li">دخول</button>
      <button class="p" id="cr">إنشاء حساب المدير (أول مرة فقط)</button>
      ${logged ? '<button class="p r" id="lo">خروج</button>' : ''}
      <div class="msg" id="sm"></div></div>
    ${code ? `<div class="card"><h3>3) كود الإعداد للسائقين</h3>
      <input id="c4" readonly value="${esc(code)}" dir="ltr"><button class="p" id="cp">نسخ</button>
      <small>يُلصق مرة واحدة في تطبيق السائق. غير مطلوب إذا أضفت google-services.json إلى التطبيق.</small></div>` : ''}</div>`;
  const say = (t, ok) => { const e = $('#sm'); e.textContent = t; e.className = 'msg' + (ok ? ' ok' : ''); };
  $('#sv').onclick = () => {
    cfg = { api: $('#c1').value.trim(), db: $('#c2').value.trim() };
    localStorage.setItem('cfg', JSON.stringify(cfg)); tok = null; draw();
  };
  const go = async ep => {
    if (!cfg.api) return say('احفظ إعدادات Firebase أولاً');
    try {
      saveSession(await authCall(ep, { email: ADMIN, password: $('#c3').value }));
      last = ''; tab = 'cars'; await poll(true); draw();
    } catch (e) { say(e.message); }
  };
  $('#li').onclick = () => go('signInWithPassword');
  $('#cr').onclick = () => go('signUp');
  const lo = $('#lo'); if (lo) lo.onclick = () => { localStorage.removeItem('adm'); tok = null; D = []; draw(); };
  const cp = $('#cp'); if (cp) cp.onclick = () => { navigator.clipboard.writeText(code); cp.textContent = 'تم النسخ ✓'; };
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.t; draw(); });

async function poll(force) {
  if (!cfg.api || !cfg.db || !localStorage.getItem('adm')) { setStatus('أدخل الإعدادات وسجّل دخول المدير'); return; }
  try {
    mErr = false;
    dErr = false;
    const [dr, da, mn, dl] = await Promise.all([api('GET', 'drivers'), api('GET', 'data'), api('GET', 'maintenance').catch(() => { mErr = true; return null; }), api('GET', 'deletions').catch(() => { dErr = true; return null; })]);
    DL = Object.entries(dl || {}).flatMap(([uid, o]) => Object.values(o || {}).map(x => ({ ...x, uid })));
    MI = Object.values(mn || {}).flatMap(o => Object.values(o || {})).filter(i => i && i.veh);
    setStatus('متصل ✓ ' + new Date().toLocaleTimeString('ar'));
    const txt = JSON.stringify([dr, da, mn, dl]);
    if (txt !== last || force) {
      last = txt;
      D = Object.entries(dr || {}).map(([uid, d]) => {
        const x = (da || {})[uid] || {};
        return { uid, name: d.name || d.username, username: d.username, vehicle: d.vehicle || '', active: d.active === true,
          lastSync: x.lastSync, photo: x.photoTime || 0, points: Object.values(x.points || {}), trips: Object.values(x.trips || {}), profile: x.profile || {}, invoices: Object.values(x.invoices || {}) };
      });
      if (tab !== 'set' && tab !== 'drv') draw();
    }
  } catch (e) { setStatus('خطأ: ' + e.message); }
}
new MutationObserver(loadAvatars).observe($('#m'), { childList: true });

// ---------- حذف رحلة (المدير): علامة حذف للهاتف + إزالة الرحلة ونقاطها من قاعدة البيانات ----------
document.addEventListener('click', async e => {
  const b = e.target.closest('.tdel'); if (!b) return;
  const v = D.find(x => x.uid === b.dataset.u), id = b.dataset.t;
  const t = v && v.trips.find(x => String(x.id) === id); if (!t) return;
  const pts = v.points.filter(p => String(p.tripId) === id);
  if (!confirm(`حذف رحلة ${v.name} (${when(t.startTime)})؟\nستُحذف معها ${pts.length} نقطة نهائياً من البرنامج ومن هاتف السائق، ولا يمكن التراجع.`)) return;
  b.disabled = true;
  try {
    await api('PUT', `removed/${v.uid}/${id}`, { id: Number(id), time: Date.now() }); // أولاً: كي لا تعود من هاتف السائق
    for (const p of pts) await api('DELETE', `data/${v.uid}/points/${p.id}`);
    await api('DELETE', `data/${v.uid}/trips/${id}`);
    await poll(true); draw();
  } catch (err) {
    alert('تعذّر الحذف: ' + err.message + '\nتأكد من لصق قواعد Firebase الجديدة (قسم removed) ثم Publish.');
    b.disabled = false;
  }
});
draw(); poll(); setInterval(poll, 10000);

// ---------- Agrimatco - Fleet: اسم الملف/العنوان عند الطباعة وحفظ PDF ----------
function pdfName() {
  const t = document.querySelector('nav button.on');
  return 'Agrimatco - Fleet - ' + (t ? t.textContent.replace(/[0-9\s]+$/, '').trim() : 'تقرير') + ' - ' + new Date().toISOString().slice(0, 10);
}
(function () {
  let old = 'Agrimatco - Fleet';
  window.addEventListener('beforeprint', () => {
    old = document.title; document.title = pdfName();
    const d = document.getElementById('pdate'); if (d) d.textContent = new Date().toLocaleDateString('ar', { year: 'numeric', month: 'long', day: 'numeric' });
  });
  window.addEventListener('afterprint', () => { document.title = old || 'Agrimatco - Fleet'; });
})();
async function savePdf() {
  const d = document.getElementById('pdate'); if (d) d.textContent = new Date().toLocaleDateString('ar', { year: 'numeric', month: 'long', day: 'numeric' });
  document.body.classList.add('pdfmode'); // الترويسة تأتي من قالب PDF (تتكرر في كل صفحة)
  try { await window.fleetAPI.savePdf(pdfName()); } catch (e) { alert('تعذّر حفظ PDF: ' + e.message); }
  document.body.classList.remove('pdfmode');
}
